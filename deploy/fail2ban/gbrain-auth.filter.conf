# /etc/fail2ban/filter.d/gbrain-auth.conf — failed / unauthenticated hits on GBrain front doors.
# Log line: 203.0.113.7 [2026-01-01T02:04:57+00:00] "POST /mcp" 401 52 rt=0.003 front=198.51.100.1:443
# fail2ban removes the matched timestamp before applying failregex, hence the optional "[...]" rest.
# 429 (rate limited) is deliberately not a failure: legitimate bursts must not get banned.
[Definition]
failregex = ^<HOST> (?:\[\S*\] )?"[A-Z]+ [^"]*" (?:401|403|444) 
ignoreregex =
datepattern = %%Y-%%m-%%dT%%H:%%M:%%S%%z
