# /etc/nginx/conf.d/gbrain-http.conf — http-context definitions for every GBrain front door.
# Definitions only; no listeners. Installed by /srv/gbrain/bin/enable-frontdoor.sh.

# 1 when the request carries a plausible bearer credential; everything else on /mcp is dropped.
map $http_authorization $gbrain_bearer {
    default                                   0;
    "~^[Bb]earer [A-Za-z0-9._~+/=-]{20,}$"    1;
}

# Never write secrets to the access log: magic-link paths carry a one-time token.
map $uri $gbrain_log_uri {
    default            $uri;
    "~^/admin/auth/"   "/admin/auth/<redacted>";
}

limit_req_zone  $binary_remote_addr zone=gbrain_mcp:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=gbrain_auth:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=gbrain_conn:10m;

# fail2ban (filter gbrain-auth) parses this format: keep the leading "$remote_addr [time]".
log_format gbrain '$remote_addr [$time_iso8601] "$request_method $gbrain_log_uri" $status '
                  '$body_bytes_sent rt=$request_time front=$server_addr:$server_port';
